<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Voice Architect</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>

  <rect x="24" y="170" width="150" height="120" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="99" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Engineer</text>
  <text x="99" y="230" text-anchor="middle" font-size="12" fill="#334155">describes the design</text>
  <text x="99" y="250" text-anchor="middle" font-size="12" fill="#334155">out loud, can interrupt</text>

  <rect x="226" y="150" width="190" height="160" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="321" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Amazon Nova 2 Sonic</text>
  <text x="321" y="206" text-anchor="middle" font-size="12" fill="#334155">Amazon Bedrock</text>
  <text x="321" y="236" text-anchor="middle" font-size="12" fill="#334155">speech in, speech out,</text>
  <text x="321" y="256" text-anchor="middle" font-size="12" fill="#334155">tool calls, barge-in</text>

  <rect x="468" y="150" width="190" height="160" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="563" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Strands BidiAgent</text>
  <text x="563" y="206" text-anchor="middle" font-size="12" fill="#334155">system prompt + 8 tools</text>
  <text x="563" y="236" text-anchor="middle" font-size="12" fill="#334155">update_design (one call per</text>
  <text x="563" y="256" text-anchor="middle" font-size="12" fill="#334155">sentence), review_risks,</text>
  <text x="563" y="276" text-anchor="middle" font-size="12" fill="#334155">new_design, estimate_cost ...</text>

  <rect x="710" y="70" width="266" height="330" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="843" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Plain Python, tested without AWS</text>
  <rect x="728" y="118" width="230" height="52" rx="7" fill="#ffffff" stroke="#10b981"/>
  <text x="843" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Design model</text>
  <text x="843" y="158" text-anchor="middle" font-size="11" fill="#334155">components, flows, stated vs unknown facts</text>
  <rect x="728" y="180" width="230" height="52" rx="7" fill="#ffffff" stroke="#10b981"/>
  <text x="843" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Well-Architected rules</text>
  <text x="843" y="220" text-anchor="middle" font-size="11" fill="#334155">deterministic: the model reports, never invents</text>
  <rect x="728" y="242" width="230" height="52" rx="7" fill="#ffffff" stroke="#10b981"/>
  <text x="843" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Cost table + next question</text>
  <text x="843" y="282" text-anchor="middle" font-size="11" fill="#334155">approximate prices, question chosen by code</text>
  <rect x="728" y="304" width="230" height="52" rx="7" fill="#ffffff" stroke="#10b981"/>
  <text x="843" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Diagram renderer</text>
  <text x="843" y="344" text-anchor="middle" font-size="11" fill="#334155">SVG with risk badges, Markdown doc</text>

  <rect x="468" y="440" width="508" height="96" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="722" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Live web page (localhost)</text>
  <text x="722" y="494" text-anchor="middle" font-size="12" fill="#334155">diagram + risks + monthly cost + conversation, updating as you speak</text>
  <text x="722" y="514" text-anchor="middle" font-size="12" fill="#334155">and a design document written on request</text>

  <line x1="174" y1="230" x2="224" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
  <line x1="416" y1="230" x2="466" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
  <line x1="658" y1="230" x2="708" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
  <line x1="843" y1="400" x2="843" y2="438" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="321" y="340" text-anchor="middle" font-size="12" fill="#475569">internet (us-east-1)</text>
  <text x="99" y="320" text-anchor="middle" font-size="12" fill="#475569">microphone and speaker</text>
  <text x="563" y="340" text-anchor="middle" font-size="12" fill="#475569">runs on your laptop</text>
</svg>
